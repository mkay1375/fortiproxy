services:
  fortiproxy:
    image: ${FORTIPROXY_IMAGE:-ghcr.io/mkay1375/fortiproxy:latest}
    init: false
    environment:
      FORTIPROXY_DATA: /data
    volumes:
      - profile-data:/data
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - "c 108:* rwm"
    ports:
      - "127.0.0.1:48731:8787"
      - "127.0.0.1:48732:1080"
      - "127.0.0.1:48733:8080"
    tmpfs:
      - /run:rw,nosuid,nodev,mode=755
      - /tmp:rw,nosuid,nodev,mode=1777
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    mem_limit: 256m

volumes:
  profile-data:
